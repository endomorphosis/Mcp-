[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-plus-plus-contracts"
version = "0.1.0"
description = "Immutable, data-only MCP++ proof-context v0.1 contracts"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [
  { name = "MCP++ maintainers", email = "starworks5@gmail.com" },
]
keywords = [
  "mcp",
  "mcp++",
  "contracts",
  "proof-context",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/endomorphosis/Mcp-Plus-Plus"
Documentation = "https://github.com/endomorphosis/Mcp-Plus-Plus/tree/main/docs/interop"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_plus_plus_contracts", "mcp_plus_plus_contracts.*"]

[tool.setuptools.package-data]
mcp_plus_plus_contracts = ["resources/*.json"]
